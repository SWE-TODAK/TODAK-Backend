name: CI/CD Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 1. 빌드된 JAR 파일을 AWS 서버로 전송 (SCP)
      - name: Copy JAR to AWS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "build/libs/*.jar"
          target: "/home/${{ secrets.USERNAME }}/app"
          strip_components: 2 # build/libs 경로를 제거하고 파일만 전송

      # 2. 서버 접속 후 기존 프로세스 종료 및 재실행 (SSH)
      - name: Deploy to AWS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/app
            
            # 8080 포트를 사용 중인 기존 프로세스 종료
            fuser -k 8080/tcp || true
            
            # 새 JAR 파일 실행 (로그는 app.log에 기록)
            nohup java -jar *.jar --spring.profiles.active=prod > app.log 2>&1 &