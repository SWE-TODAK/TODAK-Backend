name: CI/CD Deploy

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 1. 빌드된 JAR 파일을 AWS 서버로 전송 (SCP)
      - name: Copy JAR to AWS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "build/libs/*.jar"
          target: "/home/${{ secrets.USERNAME }}/app"
          strip_components: 2

      # 2. AWS 서버에서 실행 (AI_INTERNAL_KEY 주입 추가)
      - name: Deploy to AWS
        uses: appleboy/ssh-action@master
        env:
          AI_INTERNAL_KEY: ${{ secrets.AI_INTERNAL_KEY }} 
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          envs: AI_INTERNAL_KEY
          script: |
            cd /home/${{ secrets.USERNAME }}/app
            fuser -k 8080/tcp || true
            export $(grep -v '^#' .env | xargs)            
            nohup java -jar -DAI_INTERNAL_KEY=$AI_INTERNAL_KEY *.jar --spring.profiles.active=prod > app.log 2>&1 < /dev/null &
