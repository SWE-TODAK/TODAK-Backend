name: CI/CD Deploy

on:
  push:
    branches: [ main ] # main 브랜치에 push될 때 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew #

      - name: Build with Gradle
        run: ./gradlew clean build -x test # 테스트 제외 빌드 (필요시 수정)

      # 이후 Docker 이미지 빌드 및 서버 전송 스크립트 추가