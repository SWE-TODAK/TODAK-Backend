spring:
  application:
    name: todak
  profiles:
    active: prod

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false

jwt:
  secret: ${JWT_SECRET}
  access-exp-min: 30
  refresh-exp-days: 14

app:
  kakao:
    unlink-uri: https://kapi.kakao.com/v1/user/unlink